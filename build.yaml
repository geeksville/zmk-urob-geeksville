# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # - board: planck_rev6
  # - board: corneish_zen_v2_left
  # - board: corneish_zen_v2_right
  # - board: glove80_lh
  # - board: glove80_rh

  # My eyelash boards running BLE without a dongle and using BLE status advertisements
  - board: eyelash_corne_left
    shield: nice_view
    snippet: studio-rpc-usb-uart
  # I don't think I need two versions of the reset load
  # - board: eyelash_corne_left
  #   shield: settings_reset
  - board: eyelash_corne_right
    shield: nice_view

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

  - board: nice_nano_v2
    shield: eyeslash_corne_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyeslash_corne_central_dongle_oled
  - board: nice_nano_v2
    shield: eyeslash_corne_peripheral_left nice_view_custom
  - board: nice_nano_v2
    shield: eyeslash_corne_peripheral_right nice_view_custom    
    
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: toucan_left
    # Turn off studio-rpc-usb-uart for now
    # snippet: zmk-usb-logging
    # geeksville: turn off studio for now -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    # cmake-args:  -DCONFIG_ZMK_LOG_LEVEL=4
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    snippet: zmk-usb-logging
    artifact-name: toucan_right
    # hmm - cmake args seems to be ignored, add to the .config file systead
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_DBG=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000

  - board: seeeduino_xiao_ble
    shield: crosses_dongle underdongle_adapter raw_hid_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: crosses_dongle
  - board: nice_nano_v2
    shield: crosses_left
    artifact-name: crosses_54_left
  - board: nice_nano_v2
    shield: crosses_right
    artifact-name: crosses_54_right